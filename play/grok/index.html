<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020814" />
    <title>Captain's Academy: Night Arrival (Grok's take on Long Beach docking)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #020814;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #f4d06f;
        font:
          600 22px/1.4 system-ui,
          sans-serif;
        text-align: center;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate {
          display: flex;
        }
        #game {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Turn your phone sideways for the night arrival.</div>
    <script type="module" src="/src/game/grok/main.ts"></script>
  </body>
</html>
