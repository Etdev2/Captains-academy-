name: Claude Code

# Wakes Claude Code (anthropics/claude-code-action, official) when an allowed
# actor mentions @claude. Each run authenticates with the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (from `claude setup-token`, uses Et's Claude subscription, not API credit), which Et added on 2026-10-20; this file creates none.
# A mention is a wake, not authority: Claude builder still starts product work
# only on a ready-for-agent ticket that Et named it on (Sweet Potato ADR 0006),
# and this project is at stage 0, so no builder runs yet.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

# No default token access; the job below asks only for what the action needs.
permissions: {}

concurrency:
  # One Claude run per issue or pull request at a time (one active attempt).
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only Et and the coordinator app may wake Claude. The action also refuses
    # actors without write access and bots not listed in allowed_bots.
    if: |
      (github.actor == 'Etdev2' || github.actor == 'sweet-potato-coordinator[bot]') && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: sweet-potato-coordinator[bot]
          # Web lookups plus file edits, git, npm/npx/node and repo scripts so
          # Claude can build and test on ready-for-agent tickets.
          claude_args: |
            --allowedTools "WebFetch,WebSearch,Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(bash scripts/*),Bash(scripts/*)"
